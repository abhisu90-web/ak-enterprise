<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AK Enterprise | Digital Branding & Business Solutions</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#0d0d0d;
color:#fff;
overflow-x:hidden;
}

:root{
--gold:#d4af37;
--dark:#0d0d0d;
}

/* HERO */

.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
background:
linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.85)),
url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=1200');
background-size:cover;
background-position:center;
}

.hero-content{
max-width:900px;
}

.logo{
font-size:60px;
font-weight:800;
color:var(--gold);
}

.tagline{
font-size:22px;
margin-top:10px;
margin-bottom:20px;
}

.services-list{
line-height:2;
color:#ddd;
}

.btns{
margin-top:30px;
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}

.btn{
padding:14px 28px;
border:none;
border-radius:50px;
font-weight:600;
text-decoration:none;
cursor:pointer;
}

.gold{
background:var(--gold);
color:#000;
}

.whatsapp{
background:#25D366;
color:#fff;
}

/* SECTION */

section{
padding:80px 20px;
}

.section-title{
text-align:center;
font-size:40px;
color:var(--gold);
margin-bottom:40px;
}

.about{
max-width:900px;
margin:auto;
text-align:center;
line-height:1.8;
color:#ddd;
}

/* CARDS */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
max-width:1200px;
margin:auto;
}

.card{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
padding:25px;
border-radius:20px;
backdrop-filter:blur(10px);
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
border-color:var(--gold);
}

.card h3{
color:var(--gold);
margin-bottom:10px;
}

/* PORTFOLIO */

.portfolio{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
max-width:1200px;
margin:auto;
}

.portfolio div{
height:220px;
border-radius:20px;
background:#1b1b1b;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
border:1px solid #333;
}

/* CONTACT */

.contact{
text-align:center;
}

.contact p{
margin:10px 0;
font-size:18px;
}

.footer{
padding:25px;
text-align:center;
background:#000;
border-top:1px solid #222;
}

/* FLOAT BUTTONS */

.call-btn,
.wa-btn{
position:fixed;
right:15px;
z-index:999;
padding:15px 20px;
border-radius:50px;
text-decoration:none;
font-weight:700;
}

.call-btn{
bottom:90px;
background:#ff9800;
color:#fff;
}

.wa-btn{
bottom:20px;
background:#25D366;
color:#fff;
}

/* POPUP */

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.85);
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

.popup-box{
background:#111;
border:2px solid var(--gold);
padding:30px;
border-radius:20px;
text-align:center;
max-width:350px;
}

.popup-box h2{
color:var(--gold);
margin-bottom:15px;
}

.popup-box button{
margin-top:20px;
padding:10px 20px;
border:none;
background:var(--gold);
font-weight:700;
cursor:pointer;
border-radius:8px;
}

@media(max-width:768px){

.logo{
font-size:42px;
}

.section-title{
font-size:32px;
}

.tagline{
font-size
